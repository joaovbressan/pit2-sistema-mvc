{% extends 'base.html' %}
{% block title %}Autenticação - Sistema de Estoque{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-primary display-4"></i>
                    <h4 class="mt-2 font-weight-bold">Acesso ao Sistema</h4>
                    <p class="text-muted small">Projeto Integrador II - Engenharia de Software</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label font-weight-bold">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Ex: admin" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="senha" class="form-label font-weight-bold">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                    </button>
                </form>

                <div class="mt-3 text-center">
                    <small class="text-muted">Credenciais padrão de teste: <strong>admin</strong> / <strong>admin123</strong></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
